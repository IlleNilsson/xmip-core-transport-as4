# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-as4"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-as4"
description = "AS4 transport: the OASIS ebMS 3.0 AS4 profile over HTTP — one User Message is one Stream, its parties and collaboration beside it, answered with a Receipt signal; a Receive Location answers partners, a Send Location posts to one. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The http technology is the carrier the manifest
# declares: AS4 is a SOAP 1.2 envelope and a MIME attachment in an HTTP
# POST, answered with a Receipt, and the request, the answer and the
# endpoint are read there. Standard library otherwise: the envelope is
# written and scanned here, as the estate does with flat XML. The
# WS-Security signer the manifest names, xmip-core-authenticate-certificate,
# plugs in through the Signer trait.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# XML character data, escaped as every reader in the estate unescapes it.
codec = { package = "xmip-core-codec", git = "https://github.com/IlleNilsson/xmip-core-codec", branch = "main" }
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[features]
# HTTPS, through http's: this technology maps its scheme to https and could
# not reach a TLS stack until 2026-09-23.
tls = ["http/tls"]
