[package]
name = "xmip-core-transport-as4"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-as4"
description = "AS4 transport: the OASIS ebMS 3.0 AS4 profile over HTTP — one User Message is one Stream, its parties and collaboration beside it, answered with a Receipt signal; a Receive Location answers Parties, a Send Location posts to one. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The http technology is the carrier the manifest
# declares: AS4 is a SOAP 1.2 envelope and a MIME attachment in an HTTP
# POST, answered with a Receipt, and the request, the answer and the
# endpoint are read there. Standard library otherwise: the envelope is
# written and scanned here, as the estate does with flat XML. The
# WS-Security signer the manifest names, xmip-core-authenticate-certificate,
# plugs in through the Signer trait. Its declaration takes the capability's
# `timeout` (`transport::configured::timeout`).
transport = { workspace = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26), and the one clock
# (xcore::Clock) its timestamps are read from.
xcore = { workspace = true }
# XML character data, escaped as every reader in the estate unescapes it.
codec = { workspace = true, optional = true }
http = { workspace = true, optional = true }
# HTTP/1.1 on the wire (`net::http`) and the URL an endpoint is
# (`net::Endpoint`): the one codec every technology riding on HTTP calls.
net = { workspace = true, optional = true }

[lints]
workspace = true

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:codec", "dep:http", "dep:net"]
# The declaration alone, with the ebMS test service and action its defaults
# name.
declaration = []
# HTTPS, through http's: this technology maps its scheme to https and could
# not reach a TLS stack until 2026-09-23; the technology's code, so the
# default with it.
tls = ["default", "http/tls"]
